<!DOCTYPE html>
<html>
<head>
    <title>Super City - Room Demo</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial;
            text-align: center;
        }

        h1 {
            margin: 10px;
        }

        canvas {
            background: #c9b18a;
            border: 4px solid white;
            max-width: 95%;
        }

        #info {
            margin: 10px;
            font-size: 18px;
        }
    </style>
</head>

<body>

<h1>Super City - Room Demo</h1>

<div id="info">
    Use W A S D or Arrow Keys to move |
    Time: <span id="time">10:00</span>
</div>

<canvas id="game" width="800" height="500"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const player = {
    x: 380,
    y: 230,
    size: 30,
    speed: 4
};

const keys = {};

document.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});


// Furniture

const furniture = [
    {x: 100, y: 100, w: 180, h: 60, color: "#704214"},
    {x: 500, y: 90,  w: 180, h: 70, color: "#553377"},
    {x: 90,  y: 350, w: 220, h: 80, color: "#eeeeee"},
    {x: 570, y: 330, w: 120, h: 100, color: "#784421"}
];


// Collision

function collision(a, b) {
    return (
        a.x < b.x + b.w &&
        a.x + a.size > b.x &&
        a.y < b.y + b.h &&
        a.y + a.size > b.y
    );
}


// Player movement

function movePlayer() {

    let oldX = player.x;
    let oldY = player.y;

    if (keys["w"] || keys["arrowup"])
        player.y -= player.speed;

    if (keys["s"] || keys["arrowdown"])
        player.y += player.speed;

    if (keys["a"] || keys["arrowleft"])
        player.x -= player.speed;

    if (keys["d"] || keys["arrowright"])
        player.x += player.speed;


    // Room boundaries

    player.x = Math.max(20, player.x);
    player.y = Math.max(20, player.y);

    player.x = Math.min(
        canvas.width - player.size - 20,
        player.x
    );

    player.y = Math.min(
        canvas.height - player.size - 20,
        player.y
    );


    // Furniture collision

    for (let item of furniture) {

        if (collision(player, item)) {
            player.x = oldX;
            player.y = oldY;
        }
    }
}


// Draw room

function drawRoom() {

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Floor

    ctx.fillStyle = "#c9b18a";
    ctx.fillRect(
        20,
        20,
        canvas.width - 40,
        canvas.height - 40
    );


    // Floor lines

    ctx.strokeStyle = "rgba(0,0,0,0.12)";

    for (let x = 20; x < 800; x += 50) {
        ctx.beginPath();
        ctx.moveTo(x, 20);
        ctx.lineTo(x, 480);
        ctx.stroke();
    }

    for (let y = 20; y < 500; y += 50) {
        ctx.beginPath();
        ctx.moveTo(20, y);
        ctx.lineTo(780, y);
        ctx.stroke();
    }


    // Walls

    ctx.fillStyle = "#333";

    ctx.fillRect(0, 0, 800, 20);
    ctx.fillRect(0, 0, 20, 500);
    ctx.fillRect(780, 0, 20, 500);
    ctx.fillRect(0, 480, 800, 20);


    // Furniture

    for (let item of furniture) {

        ctx.fillStyle = item.color;

        ctx.fillRect(
            item.x,
            item.y,
            item.w,
            item.h
        );

        ctx.strokeStyle = "#222";

        ctx.strokeRect(
            item.x,
            item.y,
            item.w,
            item.h
        );
    }
}


// Draw character

function drawPlayer() {

    // Body

    ctx.fillStyle = "#2878ff";

    ctx.fillRect(
        player.x,
        player.y + 10,
        player.size,
        player.size
    );


    // Head

    ctx.fillStyle = "#f2c29b";

    ctx.beginPath();

    ctx.arc(
        player.x + 15,
        player.y + 5,
        12,
        0,
        Math.PI * 2
    );

    ctx.fill();


    // Eyes

    ctx.fillStyle = "black";

    ctx.fillRect(
        player.x + 9,
        player.y + 2,
        3,
        3
    );

    ctx.fillRect(
        player.x + 18,
        player.y + 2,
        3,
        3
    );
}


// Timer

let seconds = 600;

setInterval(() => {

    if (seconds > 0) {
        seconds--;

        let minutes = Math.floor(seconds / 60);
        let remaining = seconds % 60;

        document.getElementById("time").textContent =
            String(minutes).padStart(2, "0") +
            ":" +
            String(remaining).padStart(2, "0");
    }

}, 1000);


// Game loop

function gameLoop() {

    if (seconds > 0) {

        movePlayer();

        drawRoom();

        drawPlayer();

    } else {

        drawRoom();

        ctx.fillStyle = "rgba(0,0,0,0.7)";
        ctx.fillRect(0, 0, 800, 500);

        ctx.fillStyle = "white";
        ctx.font = "40px Arial";
        ctx.textAlign = "center";

        ctx.fillText(
            "TIME'S UP!",
            400,
            250
        );
    }

    requestAnimationFrame(gameLoop);
}

gameLoop();

</script>

</body>
</html>
